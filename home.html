<!DOCTYPE html>
<html>
  <head>
    <title>Home Page</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.cdnfonts.com/css/andrew-elegant" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">  
    <style>
    body{
        overflow-x:hidden;
        background-color: #f5f1e8;
      }
      p{
        margin:0;
        padding:0;
      }
      button{
        margin:0;
        padding:0;
      }
      @media(min-width:768px){
       }
      @media(min-width:640px){
      }
      /* tab1 */
      .tab1-home{
        margin-top:11vh;
        min-height:100vh;
        position:relative;
      }
      .container-bg{
        display:block;
      }
      .bg{
        min-height:100vh;
        width:100%;
        object-fit:cover;
        filter:brightness(20%);
        margin:0;
        padding:0;
        position:relative;
        left:0;
      }
      .container-bg-bg-title{
       z-index:2;
       position:absolute;
       top:50%;
       left:0;
       right:0;
      }
      .container-bg-title{
        display: block;
      }
       .bg-title{
        text-align: center;
       font-family:andrew elegant;
       font-size:clamp(22px,4vw,55px);
       color:#f5f1e8;
       }
      .container-bg-title1{
        display: block;
      }
      .bg-title1{
        text-align: center;
        font-family:Inter;
        color:#ffffff;
        font-size:clamp(12px,2vw,20px);
        font-style:solid;
        font-weight:500;
      }
      .info-grid{
        display:grid;
        grid-template-columns: repeat(4,1fr);
        gap:4%;
        position:absolute;
        padding-left:11%;
        padding-right:15%;
        transform: translateY(-50%);
      }
       .hostel-info{
        background-color:#5a684e;
        border:none;
        border-radius:10px;
        color:#f5f1e8;
        font-size:clamp(6px,2vw,25px);
        font-style:solid;
        text-align:center;
        font-family:Tahoma;
        aspect-ratio: 2/2;
        padding-top:clamp(10px,2vw,30px);
        padding-bottom:clamp(10px,2vw,30px);
        padding-left:clamp(10px,1.5vw,25px);
        padding-right:clamp(10px,1.5vw,25px);
        line-height:clamp(12px,2.5vw,39px);
        transition: all 0.15s;
      }  
      .hostel-info:hover{
        margin-top:-10px;
        margin-bottom:10px;
        box-shadow:20px 20px 20px rgba(0,0,0,0.25);
        cursor:pointer;
      }

      /*  tab2  */
      .tab2-home{
        min-height:100vh;
        position:relative;
        margin-top:22%;
      }
      .container-facilities-title{
        position:absolute;
        left:0;
        right:0;
      }
      .facilities-title{
       font-family:andrew elegant;
       font-size:clamp(22px,4vw,55px);
       color:#5a684e;
       text-align:center;
       display:block;
      }
       .facilities-grid{
        display:grid;
        grid-template-columns:repeat(5,17vw);
        gap:2.25%;
        position:relative;
        transform: translateY(30%);
        width:100%;
        max-width:100vw;
       }
      .music_button,
      .library_button,
      .mess_button,
      .canteen_button,
      .tv_button{
        width:100%;
        aspect-ratio: 3/4;
        background-color:#f5f1e8;
        border-radius:150px;
        border:none;
        box-shadow:20px 20px 20px rgba(0, 0, 0, 0.15);
        transition:all 0.15s;
        padding: 0;
      }
      .music_img,
      .library_img,
      .tv_img,
      .canteen_img,
      .mess_img{
        width:100%;
        aspect-ratio: 3/4;
        border-radius:150px;
        object-fit:cover;
        margin:0;
        padding:0;
      }
         .library_button:hover,
      .canteen_button:hover{
        cursor:pointer;
        margin-top:10px;
      }
      .mess_button:hover{
        cursor:pointer;
        margin-top:-10px;
      }
      .music_button:hover,
      .tv_button:hover{
        cursor:pointer;
        margin-top:80px;
      }
      .tv_button{
        transform:rotate(10deg);
        margin-top:90px;
      }
      .music_button{
        transform:rotate(-10deg);
        margin-top:90px;
      }
      .library_button{
        transform:rotate(-5deg);
        margin-top:20px;
      }
      .canteen_button{
        transform:rotate(5deg);
        margin-top:20px;
      }
      .facilities-button{
        position:relative;
        display:flex;
        align-items: center;
        justify-content: center;
        margin-top: 17%;
      }
      .view-facilities{
        font-family:Tahoma;
        background-color:#B39A78;
        color:white;
        font-size:clamp(14px,3vw,36px);
        padding-top:clamp(13px,2vw,23px);
        padding-bottom:clamp(13px,2vw,23px);
        padding-left:clamp(32px,3vw,69px);
        padding-right:clamp(32px,3vw,300px);
        border:none;
        border-radius:50px;
        cursor:pointer;
        line-height:100%;
        box-shadow:20px 20px 20px rgba(0,0,0,0.15);
        transform: all 0.25s;
      }
       .view-facilities:hover{
        box-shadow: 25px 25px 25px rgba(0,0,0,0.15);
        }
      .container-arrow{
        position: absolute;
         left:66%;
         right:29%;
         display:flex;
      }
      .arrow{
         background-color:#5A684E;
         border:none;
         border-radius:105px;
         padding-left:10px;
         padding-right:10px;
         padding-top:10px;
         padding-bottom:10px;
         z-index:40;
         cursor:pointer;
      }
      .arrow_img{
        aspect-ratio:1/1;
        width:clamp(3vw,1vw,5vw);
        z-index:20;
      }

      

      /* tab3-home */
      .tab3-home{
        min-height:100vh;
        position:relative;
        margin-top:22%;
      }
    </style>
  </head>
  <body>
   <div class="tab1-home">
     <div class="container-bg">
        <img class="bg" src="background/background.jpg">
        <img class="bg" src="background/background1.jpg">
        <img class="bg" src="background/background2.jpg">
        <img class="bg" src="background/background3.jpg">
        <img class="bg" src="background/background4.jpg">
        <img class="bg" src="background/background5.jpg">
      <div class="container-bg-bg-title">
      <div class="container-bg-title"><p class="bg-title">
        DISANG HOSTEL IIT GUWAHATI
      </p></div>
      <div class="container-bg-title1"> <p class="bg-title1">
        A HOME AWAY FROM HOME, FOSTERING COMMUNITY, GROWTH, AND EXCELLENCE
      </p>
      </div>
      </div>
      </div>
      
      <div class="info-grid">
        <button class="hostel-info">
          INAUGURATED ON JULY 24, 2019
        </button>
        <button class="hostel-info">
          TWO WINGS WING A & WING C
        </button>
        <button class="hostel-info">
          <p>A WING : 500 </p> 
           C WING : 650
        </button>
        <button class="hostel-info">
          1100 STUDENTS
        </button>
      </div>
   </div>

   <div class="tab2-home">
    <div class="container-facilities-title"> <p class="facilities-title">
        FACILITIES
      </p>
    </div>
    <div class="facilities-grid">
    <button class="music_button">
      <img class="music_img" src="facilities/Music_room.png">
    </button>
    <button class="library_button">
      <img class="library_img" src="facilities/Library.png">
    </button>
    <button class="mess_button">
      <img class="mess_img" src="facilities/mess.png">
    </button>
    <button class="canteen_button">
      <img class="canteen_img" src="facilities/Canteen.png">
    </button>
    <button class="tv_button">
      <img class="tv_img" src="facilities/TV_room.png">
    </button>
    </div>
    <div class="facilities-button">
      <button class="view-facilities">
        VIEW ALL FACILITIES
      </button>
        <div class="container-arrow"> <button class="arrow" >
          <img class="arrow_img" src="icons/arrow.png">
        </button>
      </div>
    </div>
   </div>

   <div class="tab3-home">

   </div>
   <script>
    var slideIndex = 0;
    carousel();

    function carousel() {
    var i;
    var x = document.getElementsByClassName("bg");
    for (i = 0; i < x.length; i++) {
    x[i].style.display = "none";
    }
    slideIndex++;
    if (slideIndex > x.length) {slideIndex = 1}
    x[slideIndex-1].style.display = "block";
    setTimeout(carousel, 3000); // Change image every 3 seconds
    }
    </script>
  </body>
</html>
